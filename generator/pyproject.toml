[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-generator"
version = "0.3.0"
description = "Grounded Discrete-Event Multi-Agent Payment Fraud Simulation & Causal XAI Benchmark"
readme = "README.md"
license = { text = "Apache-2.0" }
# The floor is set by the dependency set this project resolves to, not by preference:
# numpy 2.5, scipy 1.18 and shap 0.52 all require >=3.12, and 3.12 is the interpreter
# CI exercises (.github/workflows/ci.yml). Older interpreters would need older
# dependency pins that nothing here tests.
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.22.0",
    "pyyaml>=6.0",
    "polars>=0.20.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "matplotlib>=3.8.0",
]


[project.optional-dependencies]
benchmark = [
    "shap>=0.44.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "polars>=0.20.0",
    "scipy>=1.10.0",
    "matplotlib>=3.8.0",
]
dev = [
    "pytest>=7.0.0",
    "scikit-learn>=1.3.0",
    "polars>=0.20.0",
    "ruff>=0.6.0",
]
gui = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
]
docs = [
    "python-docx>=1.1.0",
]

[project.scripts]
prism-generate = "prism_generator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prism_generator*", "gui*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    # Long-running simulation tests (>=10 s each; the whole suite is ~8 min).
    # Deselect with `-m "not slow"` for a fast inner loop; CI runs everything.
    "slow: end-to-end or large-batch simulation tests that take >=10 seconds",
]

[tool.ruff]
# Correctness-only gate, deliberately narrow. The broader catalogue (UP/SIM/BLE/
# RUF/...) is left off on purpose: enabling it would rewrite working code for
# style alone. This set catches real defects -- unused imports/variables (F),
# bare `except` that can swallow KeyboardInterrupt (E722), and shadowing (A) --
# without a mass reformat. Run `ruff check .` locally; CI enforces it.
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E722", "A"]

[tool.ruff.lint.per-file-ignores]
# `__init__.py` files legitimately re-export names the checker calls unused.
"**/__init__.py" = ["F401"]
# `credits` is domain vocabulary in double-entry accounting (the counterpart of
# `debits`); renaming it to dodge the `credits` builtin would obscure the model.
"prism_generator/ledger.py" = ["A001", "A002"]
