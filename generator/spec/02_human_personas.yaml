circadian_diurnal_model:
  mathematical_form: "periodic_24h_von_Mises_mixture"
  formula: "phi(t) = beta_0 + (24 - 24*beta_0) * sum(w_k * exp(kappa_k * cos(2*pi*(t - mu_k)/24)) / (24 * I_0(kappa_k)))"
  weekday_profile:
    nocturnal_floor_beta_0: 0.025
    components:
      - { name: "Morning Commute", mu_hour: 8.25, kappa: 4.2, weight: 0.22 }
      - { name: "Lunch Rush", mu_hour: 12.60, kappa: 4.8, weight: 0.32 }
      - { name: "Evening Errands", mu_hour: 18.50, kappa: 3.6, weight: 0.34 }
      - { name: "Night Browsing", mu_hour: 21.25, kappa: 3.0, weight: 0.12 }
  weekend_profile:
    nocturnal_floor_beta_0: 0.040
    components:
      - { name: "Brunch & Retail", mu_hour: 11.50, kappa: 2.4, weight: 0.42 }
      - { name: "Dinner Social", mu_hour: 18.75, kappa: 2.6, weight: 0.43 }
      - { name: "Nightlife", mu_hour: 23.25, kappa: 3.5, weight: 0.15 }
  # Added 2026-10-16 (arrival-shape slice). The portfolio's arrival stream is the sum of
  # individual local clocks, not one shared clock: a cardholder's day runs on their own
  # time zone and chronotype. The engine draws, per card:
  #   phase_offset_sec = ((circadian_peak_hour - 13.5) + time_zone_offset) * 3600
  # `circadian_peak_hour` (uniform 11.5-15.5 h, agents.py CardholderProfile) existed on
  # the profile but was previously unused; this block makes it live. Time-zone offsets are
  # ET/CT/MT/PT with population shares 0.47/0.29/0.07/0.17 (Census state populations
  # mapped to zones; AK/HI folded into PT so the weights sum to 1.0), US cards only. The
  # per-card draw uses a card-derived RNG stream so existing sampling streams are not
  # shifted. Measured effect (seed 42, 80 cards, n=2000, 12d): aggregate hour-profile L1
  # against the IEEE-CIS portfolio profile 0.2694 -> 0.1720 (chronotype only) / 0.2196
  # (composite vs the corpus-aligned profile); rate-invariant arrival W1 across seeds
  # 42/0/1/2/3 improves 0.0490 -> 0.0468 mean. The diurnal mean stays 0.8208: a phase
  # shift leaves the mean over S^1 unchanged, so the pacing divisor is untouched.
  # Mirrored in engine._us_timezone_offset_hours and engine._initialize_cardholders.
  # Region scope is enforced in engine._initialize_cardholders (2026-10-16): the chronotype
  # term applies only when applies_to_regions names the card's region (the per-card peak is
  # still drawn for every card, so sampling streams do not shift). A leaked non-US phase
  # moved the IN leakage sweep's eci to 0.9501, over spec/07's 0.95 single-column ceiling at
  # playbook/7d; with the declared scope enforced the sweep tops out at 0.9419
  # (playbook/21d), inside the ceiling.
  population_phase_dispersion:
    enabled: true
    chronotype_peak_range_hours: [11.5, 15.5]
    reference_peak_hour: 13.5
    time_zone_offsets_hours: [0.0, -1.0, -2.0, -3.0]
    time_zone_population_shares: [0.47, 0.29, 0.07, 0.17]
    applies_to_regions: ["US"]

