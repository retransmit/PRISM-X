# Ticket-scale recalibration (2026-10-16): the certification Pillar-1 amount gate
# compares simulated log10(1 + amount) against the spec-pinned real reference
# (spec/18 `pillar_1_real_reference`: IEEE-CIS card-not-present corpus, sha256
# 3a5c83ab6b3c...). That corpus's legitimate-ticket median is ~USD 68 against the
# clusters' ~USD 28 -- a uniform x2.46 location gap, measured W1 0.35-0.41 against
# a size-calibrated limit of 0.0916 (failed on 5/5 stability seeds). Every US
# cluster ticket parameter below was therefore scaled by e^0.90 = 2.45960
# (mu_log + 0.90; spliced thresholds and GPD betas x 2.45960; documented
# mean/percentiles x 2.45960). Scaling the LogNormal/Spliced-LogNormal-GPD
# parameters scales every quantile exactly, so the documented values remain
# exact. Post-calibration measured W1 on the five stability seeds (n=2000,
# US, 30d): 0.059-0.070, all below the 0.0916 limit. The corpus is a
# card-not-present portfolio while this mix spans CP+CNP; per-channel ticket
# calibration is tracked as future work (measured 2026-10-16: simulated CP and
# CNP ticket medians are equal, so channel-conditional grading alone cannot
# close this gap).
