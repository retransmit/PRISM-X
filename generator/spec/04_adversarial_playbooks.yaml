      bot_signatures:
        python_requests: "t13d1516h2_8daaf6152771_e562703ab853"
        go_http: "t12i1212h1_7caa04519921_b124802fc712"
      clean_browser_signatures:
        chrome_windows: "t13d1516h2_dfa4a7752771_c212703ab899"
        safari_macos: "t13d1415h2_08a3f8541249_4387201bc910"
    p0f_v3_tcp_stack_parameters:
      windows_11_kernel:
        initial_ttl: 128
        tcp_window_size: 64240
        wscale: 8
        options: "MSS, NOP, WScale, NOP, NOP, SACK"
      linux_kernel_container:
        initial_ttl: 64
        tcp_window_size: 29200
        wscale: 7
        options: "MSS, SACK, Timestamps, NOP, WScale"
    cross_layer_discrepancy_tripwires:
      user_agent_vs_tcp_os_mismatch: "RISK_SCORE_ADD_45"
      user_agent_vs_ja4_client_mismatch: "GATEWAY_DROP_ISO_05"

  anti_detect_browser_mechanics:
    canvas_noise_injection:
      delta_rgb_variance: [-2, 2] # Deterministic pseudo-random seed
    webgl_spoofing:
      unmasked_vendor: "Google Inc. (NVIDIA)"
      unmasked_renderer: "ANGLE (NVIDIA, NVIDIA GeForce RTX 3070 Direct3D11 vs_5_0 ps_5_0)"
    audiocontext_noise:
      float32_buffer_variance: 0.000001
    webrtc_policy: "DISABLE_NON_PROXIED_UDP"
  counter_detection_fp_scanner:
    grounding: "USENIX Security 2018 (Vastel et al.)"
    checks:
      prototype_descriptor_tampering: "Function.prototype.toString.call"
      canvas_repeatability_test_count: 5 # Real GPU produces 5/5 identical hashes
      hardware_performance_discrepancy_threshold_ms: 45.0

