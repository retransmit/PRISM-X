    qualifying_ticket_range_paisa: [40000, 400000] # ₹400 to ₹4,000
    monthly_waiver_cap_paisa: 25000                # ₹250.00
    gst_rate_percentage: 18.0
    gst_reversible_by_law: false

indian_adversarial_playbooks:
  - id: "IN_ADV_REVERSE_PROXY_VISHING"
    name: "Reverse-Proxy Vishing & Digital Arrest"
    target_products: ["IN_PROD_SALARIED_PRIME_REWARDS", "IN_PROD_SUPER_PREMIUM_HNI"]
    target_vulnerability: "HUMAN_COERCION_180S_OTP_RACE"
    lure_types: ["ELECTRICITY_BILL_CUTOFF", "DIGITAL_ARREST_CBI_POLICE", "REWARD_POINTS_EXPIRY"]
    ticket_size_paisa: [5000000, 50000000] # ₹50,000 to ₹5,00,000
    reverse_proxy_latency_seconds: [2.0, 8.0]

  - id: "IN_ADV_APK_SMS_STEALER"
    name: "Malicious Android APK SMS Forwarder"
    target_products: ["IN_PROD_SALARIED_PRIME_REWARDS", "IN_PROD_ENTRY_FD_BACKED"]
    vector: "WHATSAPP_TELEGRAM_SIDELOAD_APK"
    abused_permissions: ["android.permission.RECEIVE_SMS", "android.permission.READ_SMS", "AccessibilityService"]
    exfiltration_target: "TELEGRAM_BOT_API"
    silent_sms_suppression: true

  - id: "IN_ADV_INTL_NON_3DS_BYPASS"
    name: "International Non-3DS Gateway Route-Around"
    target_products: ["IN_PROD_SUPER_PREMIUM_HNI", "IN_PROD_SALARIED_PRIME_REWARDS"]
    prerequisite_card_state: "INTERNATIONAL_CNP_ENABLED == TRUE"
    target_merchant_geo: "US_EU_NON_3DS"
    auth_mti: "0100"
    eci_indicator: "07" # Non-authenticated
    time_window_ist_hours: [1.5, 5.5] # 01:30 - 05:30 AM IST (Cardholder asleep)
    ticket_size_usd: [150.0, 1500.0]

  - id: "IN_ADV_RENT_PORTAL_CASHOUT"
    name: "Credit-to-Bank Liquidation via Rent Portals"
    target_products: ["IN_PROD_SALARIED_PRIME_REWARDS", "IN_PROD_ENTRY_FD_BACKED"]
    platform_convenience_fee_percentage: 1.8
    settlement_rail: "IMPS_NEFT_T0"
    p2p_crypto_conversion_window_minutes: 10

  - id: "IN_ADV_SIM_SWAP_ESIM_HIJACK"
    name: "Telecom SIM Swap & eSIM Profile Hijack"
    target_products: ["IN_PROD_SUPER_PREMIUM_HNI", "IN_PROD_SALARIED_PRIME_REWARDS"]
    bypass_vector: "FRIDAY_EVENING_TELECOM_BLACKOUT_WINDOW"
    telecom_regulatory_cooldown_hours: 24 # TRAI mandatory SMS block post-swap
    exploit_channel: "IVR_VOICE_OTP_FALLBACK"

cfcfrms_1930_defensive_race:
  statutory_authority: "Indian Cybercrime Coordination Centre (I4C), MHA"
  helpline_number: 1930
  inter_bank_mesh_connected_entities: 250
  critical_golden_hour_cutoff_seconds: 900 # 15 minutes
  inter_bank_api_lien_propagation_latency_seconds: 180
  empirical_recovery_decay_model:
    formula: "P(recovery|t) = 0.82 * exp(-0.045 * t) for t <= 30 min; 0.21 * exp(-0.015 * t) for 30 < t <= 120 min; < 0.03 for t > 120 min"
    recovery_rates:
      under_15_minutes: [0.70, 0.80]
      between_15_and_45_minutes: [0.25, 0.40]
      beyond_60_minutes: 0.10

# ----------------------------------------------------------------------------------------------
# Credit line assignment
# ----------------------------------------------------------------------------------------------
# Issuers assign credit lines in steps, not as continuous amounts (see spec/01 credit_limit_assignment).
credit_limit_assignment:
  rounding_steps_paisa:
    - { up_to: 1000000,  step: 100000 }    # to Rs 10,000 in Rs 1,000 steps
    - { up_to: 5000000,  step: 500000 }    # to Rs 50,000 in Rs 5,000 steps
    - { up_to: 20000000, step: 1000000 }   # to Rs 2,00,000 in Rs 10,000 steps
    - { up_to: 50000000, step: 2500000 }   # to Rs 5,00,000 in Rs 25,000 steps
    - { up_to: null,     step: 10000000 }  # above, Rs 1,00,000 steps
  applies_to: "credit_limit_paisa and account_balance_paisa of every product, clamped to the product's range"
  hypothesis: true
  note: "replace with the line-assignment grid of an issuer's underwriting policy"
