indian_consumer_behavioral_quirks:
  payday_liquidity_cycle:
    private_sector_salary_credit_days: [28, 29, 30, 31]
    government_salary_credit_days: [1, 2, 3]
    statement_bill_payment_peak_days: [5, 6, 7, 8, 9, 10]
    liquidity_squeeze_days: [20, 21, 22, 23, 24, 25, 26, 27, 28]

  merchant_no_cost_emi:
    statutory_ban_on_zero_interest: "RBI/2013-14/292"
    upfront_merchant_discount_mechanism: true
    gst_on_interest_percentage: 18.0
    non_refundable_processing_fee_paisa: 19900 # ₹199.00 + 18% GST

  festival_seasonality:
    q3_q4_big_billion_days_surge:
      months: [9, 10]
      velocity_surge_multiplier: 6.0
      instant_discount_cap_paisa: 250000 # ₹2,500.00
    dhanteras_gold_splitting:
      mcc: 5944
      tax_rule_114b_pan_reporting_threshold_paisa: 20000000 # ₹2,00,000.00
      split_transaction_behavior:
        enabled: true
        swipes_count: [2, 3]
        spacing_seconds: [60, 180]
        ticket_ranges_paisa: [16500000, 19500000]

  fuel_surcharge_waiver_mcc_5541:
