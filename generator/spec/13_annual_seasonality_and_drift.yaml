# ------------------------------------------------------------------------------
# 5. TOP-OF-WALLET WALLET SHARE DISTRIBUTIONS
# Grounded in Federal Reserve DCPC 2024 (Table 1 & Figure 2).
# ------------------------------------------------------------------------------
wallet_hierarchy:
  tiers:
    primary:
      share_of_transactions: 0.68
      avg_monthly_tx: 12.0
      mcc_bias: "EVERYDAY_ESSENTIALS" # Groceries, fuel, QSR, routine bills
    secondary:
      share_of_transactions: 0.24
      avg_monthly_tx: 3.5
      mcc_bias: "COBRANDED_DISCRETIONARY" # Airlines, hotels, electronics, big-ticket
    backup_dormant:
      share_of_transactions: 0.08
      avg_monthly_tx: 0.8
      mcc_bias: "SPORADIC_EMERGENCY" # Sporadic emergency or international travel

# ------------------------------------------------------------------------------
# 6. ADVERSARIAL SYNDICATE CAMPAIGN SEASONALITY & CAMOUFLAGE DRIFT
# ------------------------------------------------------------------------------
adversarial_drift_schedule:
