    Q4_retail_super_peak_multiplier: 1.85 # Exploit analyst capacity saturation
    false_decline_pressure_window_multiplier: 1.60
  syndicate_burst_campaigns:
    # 48 to 72 hour episodic campaigns
    - campaign_id: "SYN_CAMP_Q1_TAX_PHISH"
      start_day: 78
      duration_days: 3
      target_channel: "CNP_WEB"
      attack_rate_multiplier: 2.40
    - campaign_id: "SYN_CAMP_Q2_SUMMER_TRAVEL_ACCOUNT_TAKEOVER"
      start_day: 165
      duration_days: 3
      target_channel: "CNP_MOBILE"
      attack_rate_multiplier: 2.10
    - campaign_id: "SYN_CAMP_Q3_BACK_TO_SCHOOL_BOTNET_BLITZ"
      start_day: 235
      duration_days: 2
