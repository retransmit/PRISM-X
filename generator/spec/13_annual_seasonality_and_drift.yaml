# ==============================================================================
# PRISM GENERATOR SPECIFICATION 13: ANNUAL SEASONALITY, CALENDAR DRIFT & MACRO SHOCKS
# ==============================================================================
# Canonical Grounding:
# 1. Federal Reserve Diary of Consumer Payment Choice (DCPC 2024 / October 2023 cycle):
#    docs/papers/2024_fed_diary_consumer_payment_choice.pdf (Bayeh, Cubides & O'Brien).
# 2. 2019 Federal Reserve Payments Study (FRPS):
#    docs/papers/2019_fed_payments_study.pdf (Board of Governors of the Federal Reserve System).
# 3. Reserve Bank of India Annual Report 2023-24 (Chapter IX: Payment & Settlement Systems):
#    docs/papers/2024_rbi_annual_report_payment_systems.pdf (RBI May 30, 2024).
# 4. BIS CPMI Brief No 3: "Tap, click and pay: how digital payments seize the day" (Feb 2024):
#    docs/papers/2024_bis_cpmi_tap_click_pay_digital_payments.pdf.
# 5. BIS CPMI Report No 154: "Fast payments - Enhancing the speed and availability of retail payments":
#    docs/papers/2016_bis_cpmi_fast_payments.pdf.
# ==============================================================================

version: "1.0.0"
jurisdiction: "US_IN_ANNUAL_SEASONALITY"

# ------------------------------------------------------------------------------
# 1. DAY-OF-WEEK (DoW) VOLUME MULTIPLIERS
# Base index: 1.0 = Average day across the 365-day year.
# Grounded in Federal Reserve DCPC 2024 and RBI Retail Payment Daily Trends.
# ------------------------------------------------------------------------------
day_of_week_multipliers:
  0: 0.88   # Monday: Commercial restart, routine bill clearing, low discretionary spend
  1: 0.95   # Tuesday: Steady corporate purchases, routine grocery replenishment
  2: 0.98   # Wednesday: Midweek baseline, recurring subscriptions
  3: 1.02   # Thursday: Ramp-up in advance bookings and weekend planning
  4: 1.22   # Friday: Workday exit surge, dining, bars, travel bookings
  5: 1.34   # Saturday: Weekly retail peak (malls, departmental, dining, family spend)
  6: 1.11   # Sunday: Family dining, weekly grocery stocking, late-evening online ordering

# ------------------------------------------------------------------------------
# 2. INTRA-MONTH PAYDAY SURGE WINDOWS
# Models liquid disposable income surges following salary disbursements.
# ------------------------------------------------------------------------------
payday_cycles:
  US:
    cycle_type: "BIWEEKLY_AND_SEMI_MONTHLY"
    primary_days_of_month: [1, 15]
    surge_multiplier: 1.35
    surge_duration_days: 2
  IN:
    cycle_type: "MONTH_END_SALARY_CREDIT"
    primary_days_of_month: [28, 29, 30, 31, 1, 2]
    surge_multiplier: 1.42
    surge_duration_days: 4

