central_switching_networks:
  US:
    primary_card_switch: "VISANET_BASE_I_II"
    backup_card_switch: "MASTERCARD_BANKNET"
    instant_payments_switch: "FEDNOW_SERVICE"
    switch_network_fee_usd: 0.0025
    off_us_interchange_rate_credit: 0.0175
    off_us_interchange_rate_debit: 0.0080
    off_us_interchange_cap_debit_usd: 0.22
  IN:
    primary_card_switch: "NPCI_NFS_RUPAY"
    instant_payments_switch: "NPCI_UPI_SWITCH"
    switch_network_fee_inr: 0.20
    off_us_interchange_rate_credit: 0.0180
    off_us_interchange_rate_debit: 0.0090
    off_us_interchange_cap_debit_inr: 150.00
    upi_interchange_p2p_inr: 0.00
    upi_interchange_p2m_inr: 0.00

routing_rules:
  on_us:
    switch_fee: 0.00
    interchange_fee: 0.00
    latency_ms_range: [8.0, 16.0]
    requires_central_switch: false
    hops: ["MERCHANT", "ACQUIRER_CBS", "ISSUER_CORE"]
  off_us:
    latency_ms_range: [45.0, 115.0]
    requires_central_switch: true
    timeout_threshold_ms: 2000.0
    timeout_rate: 0.0005
    hops: ["MERCHANT", "ACQUIRER_SWITCH", "CENTRAL_SWITCH", "ISSUER_SWITCH"]

iso8583_message_types:
  auth_request: "0100"
  auth_response: "0110"
  financial_request: "0200"
  financial_response: "0210"
  reversal_request: "0400"
  reversal_response: "0410"
  network_management_request: "0800"
  network_management_response: "0810"

clearing_and_settlement:
  clearing_cycles_per_day: 4
  cycle_cutoff_hours_utc: [6, 12, 18, 24]
  settlement_currency:
    US: "USD"
    IN: "INR"
  netting_model: "MULTILATERAL_NET_SETTLEMENT"
  zero_sum_tolerance: 0.000001
