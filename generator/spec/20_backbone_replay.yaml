# spec/20_backbone_replay.yaml
# Canonical Specification for External Backbone Replay Mode
# Grounded in:
#   - Dal Pozzolo et al. (ULB Machine Learning Group, OpenML file 1673544)
#   - Vesta Corporation / IEEE-CIS Fraud Detection Benchmark (2019)
#   - ISO 8583 / ISO 20022 Financial Messaging Specifications
#   - spec/19_detector_contract.yaml and spec/07_export_leakage_gate.yaml

schema_version: "1.0.0"
slice_id: "slice-26-external-backbone-replay-mode"
title: "External Backbone Replay Mode with Causal Attack Superimposition"

# ------------------------------------------------------------------------------
# 1. Supported External Real Corpora
# ------------------------------------------------------------------------------
