# ==============================================================================
# Canonical Specification 21: PRISM Causal Explanation Recovery & Dual-Track XAI Audit
# ==============================================================================
# Grounding:
#   - Structural Causal Models (Pearl 2009, Peters et al. 2017)
#   - Causal PRISM & Attributive Ground Truth in Fraud Detection (Chenyu Wu 2026)
#   - Axiomatic Cooperative Game Theory & Shapley Decomposition (Roth 1988, Owen 1972)
#   - Critique of Post-Hoc Shapley Explanations under Feature Correlation (Kumar et al. 2020)
#   - Model-Free Forensic Intervention Recovery (Federal Reserve & OCC Fraud Examination)
# ==============================================================================

version: "1.0.0"
slice_id: "slice-27-prism-causal-explanation-recovery"

unit_definitions:
  attribution_weight: "dimensionless normalized attribution mass in [0.0, 1.0]"
  correlation_coefficient: "rank/linear correlation in [-1.0, 1.0]"
  time_seconds: "seconds since sim_time_epoch"
  amount_currency: "major units of cardholder currency (USD / EUR / INR)"

# ------------------------------------------------------------------------------
# 1. Core Architecture: Dual-Track Separation
# ------------------------------------------------------------------------------
# In Prism Generator, an Explainable AI (XAI) benchmark asks two distinct, un-conflated questions:
#
# Track 1: Model-Free Forensic Intervention Support Recovery
#   Question: "Does the post-hoc explainer (TreeSHAP, Integrated Gradients, KernelSHAP)
#   correctly identify the true physical levers that the cybercrime adversary actually
#   modified on the victim's cardholder baseline?"
#   Ground Truth (phi*): The standardized physical intervention footprint Delta x_adversary / sigma_30d
#   over the mutated features.
#
# Track 2: Glass-Box Scoring Model Faithfulness Audit
#   Question: "Does the post-hoc explainer faithfully recover the exact closed-form
#   Shapley attribution of a known, non-linear scoring function under correlated financial features?"
#   Ground Truth (phi*): Exact Owen multilinear / 128-point Gauss-Legendre decomposition
#   evaluated directly on HeuristicBankScorer.
dual_track_framework:
  track_1_forensic_intervention_recovery:
    description: "Evaluates recovery of physical intervention support mutated by adversary"
    model_dependence: "model-free (property of data-generating simulation process alone)"
    primary_metrics:
      - "intervention_precision_at_k"
      - "intervention_recall_at_k"
      - "interventional_kendall_tau"
    standardization: "variance-normalized intervention delta: |Delta x_j| / sigma_j"
    normalization: "sum(phi*_j) == 1.0 over active intervention support"

  track_2_glass_box_explainer_audit:
    description: "Evaluates mathematical fidelity against known non-linear scoring function"
    model_dependence: "function-relative (property of HeuristicBankScorer)"
    primary_metrics:
      - "spearman_rank_rho"
      - "pearson_linear_r"
      - "relative_attribution_error_rae"
      - "subset_ablation_faithfulness"
    decomposition_algorithms:
      log_odds_logit: "exact_owen_multilinear_extension"
      probability_scale: "128_point_gauss_legendre_quadrature"

# ------------------------------------------------------------------------------
# 2. Explained Feature Contract (the eleven columns both causal benchmarks score)
# ------------------------------------------------------------------------------
# One list, read by both harnesses through prism_generator/causal_contract.py:
# the XAI harness (benchmark.py) and the four-pillar runner (benchmark_reporter.py).
# Names are the record/lever vocabulary used by `canonical_interventions` below and by
# the HeuristicBankScorer input vector (causal_scm.py), so a declared lever and a
# modelled column intersect **by name**: no alias table exists to drift.
#
# source is exactly one of:
#   {field: <record field>}                        verbatim float
#   {field: <record field>, cast: "bool01"}        1.0 when the field is truthy
#   {rule: <rule id>}                              a derivation the code owns by name
# ground_truth_key is the key in analytical_shapley_probability / _log_odds.
explained_feature_contract:
  features:
    - name: "amount"
      kind: "continuous"
      source: {field: "amount"}
      ground_truth_key: "amount_to_mean_ratio_30d"
      note: "the raw authorised ticket; the scorer attributes the 30-day ratio it consumes"
    - name: "haversine_velocity_kph"
      kind: "continuous"
      source: {field: "haversine_velocity_kph"}
      ground_truth_key: "haversine_velocity_kph"
    - name: "ip_distance_from_home_km"
      kind: "continuous"
      source: {field: "ip_distance_from_home_km"}
      ground_truth_key: "ip_distance_from_home_km"
    - name: "tx_count_1h"
      kind: "continuous"
      source: {field: "tx_count_1h"}
      ground_truth_key: "tx_count_1h"
    - name: "tx_count_24h"
      kind: "continuous"
      source: {field: "tx_count_24h"}
      ground_truth_key: "tx_count_24h"
    - name: "is_cross_border"
      kind: "binary"
      source: {field: "is_cross_border", cast: "bool01"}
      ground_truth_key: "is_cross_border_tx"
      note: "1 when the merchant country differs from the cardholder's country"
    - name: "avs_mismatch_flag"
      kind: "binary"
      source: {rule: "avs_mismatch"}
      ground_truth_key: "avs_mismatch_flag"
      note: "1 when avs_match_code is N (no match) or U (unavailable)"
    - name: "billing_shipping_mismatch"
      kind: "binary"
      source: {rule: "billing_shipping_mismatch"}
      ground_truth_key: "billing_shipping_mismatch"
      note: "1 when billing_shipping_match is 0"
    - name: "cvv_mismatch_flag"
      kind: "binary"
      source: {rule: "cvv_mismatch"}
      ground_truth_key: "cvv_mismatch_flag"
      note: "1 when cvv_match_flag is 0; mismatch polarity matches the scorer's input"
    - name: "emv_arqc_verified"
      kind: "binary"
      source: {field: "emv_arqc_verified"}
      ground_truth_key: "emv_arqc_verified"
      note: "EMV Tag 9F26 ARQC validated by the issuer HSM; a contact-chip authorisation fact"
    - name: "three_ds_authenticated"
      kind: "binary"
      source: {field: "three_ds_authenticated"}
      ground_truth_key: "three_ds_authenticated"
      note: "EMV 3DS 2.x status Y (fully authenticated); see rails.py trans_status_3ds"

