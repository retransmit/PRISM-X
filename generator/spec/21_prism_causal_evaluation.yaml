# ------------------------------------------------------------------------------
# 4. Ground Truth Construction & Normalization
# ------------------------------------------------------------------------------
# In DiscreteEventEngine, whenever an attack fires, the simulator snapshots the
# cardholder's baseline transaction:
#   factual_counterfactual = {
#     "amount": user_avg_tx_amount_30d,
#     "channel_type": card.dominant_channel,
#     "ip_distance_from_home_km": 0.0,
#     "haversine_velocity_kph": 0.0,
#     "billing_shipping_match": 1,
#     "avs_match_code": "Y",
#     "cvv_match_flag": 1
#   }
# The physical intervention delta vector is:
#   Delta x_j = x_attack,j - x_baseline,j
# The normalized ground-truth vector phi*_j is:
#   phi*_j = (|Delta x_j| / sigma_30d,j) / sum_k (|Delta x_k| / sigma_30d,k)
# where sigma_30d,j is the cardholder's 30-day Welford standard deviation for continuous
# features, and 1.0 for binary indicators.
intervention_attribution_formula:
  continuous_features:
    standardization: "z_j = |x_attack,j - x_baseline,j| / max(sigma_30d,j, 1e-4)"
  discrete_indicators:
    standardization: "z_j = 1.0 if x_attack,j != x_baseline,j else 0.0"
  masking: "z_j = 0.0 for all j not in canonical_interventions[playbook]"
  final_normalization: "phi*_j = z_j / sum_k(z_k)"

# ------------------------------------------------------------------------------
# 5. Experimental Boundary: Quarantine of Unfitted Normalizing Flow
# ------------------------------------------------------------------------------
# The Conditional RealNVP flow in prism_generator/experimental/invertible_flow.py
# contains coupling layer matrices (W1, W2_s, W2_t) that are uncalibrated random
# Gaussian draws (np.random.default_rng(42)).
#
# Statutory Invariant:
# Under the Anti-Astronaut Grounding Mandate, random-weight neural flows MUST NOT
# be used to define official certification ground truth in benchmark_reporter.py.
# All production causal attributions and counterfactual twins must come from the
# grounded physical simulation twin (factual_counterfactual / normative_baseline).
flow_quarantine:
  invertible_flow_status: "experimental_only"
  production_use_prohibited: true
  ground_truth_authority: "physical_intervention_delta"

# ------------------------------------------------------------------------------
# 6. Prequential Two-Tier Protocol Specification
# ------------------------------------------------------------------------------
# Prequential evaluation windows follow:
#   T_warmup = W_train + Delta_delay
#   N_test_windows = floor((T_realised - T_warmup) / W_test)
two_tier_protocols:
  protocol_fast:
    description: "CI/CD, automated unit tests, and rapid developer iteration"
    stream_parameters:
      n_transactions: 2000
      n_cards: 80
      time_span_days: 12.0
      stability_seeds: [42, 0, 1, 2, 3]
    prequential_windows:
      w_train_days: 3.0
      delta_delay_days: 1.5
      w_test_days: 1.0
      k_daily: 15
    warmup_days: 4.5
    expected_test_windows: [5, 8]
    badge_label: "REGRESSION (PROTOCOL_FAST)"

  protocol_full:
    description: "Camera-ready publication tables, dataset releases, and spec/17 certification"
    stream_parameters:
      n_transactions: 100000
      n_cards: 1000
      time_span_days: 75.0
      stability_seeds: [42, 0, 1, 2, 3]
    prequential_windows:
      w_train_days: 30.0
      delta_delay_days: 14.0
      w_test_days: 1.0
      k_daily: 50
    warmup_days: 44.0
    expected_test_windows: [16, 31]
    badge_label: "CERTIFIED (PROTOCOL_FULL)"

# ------------------------------------------------------------------------------
# 7. Pillar-4 attribution protocol (revised 2026-10-16)
# ------------------------------------------------------------------------------
# The Pillar-4 row grades a practical attribution method against the causal ground
# truth OF THE SAME OBJECT at the SAME reference point. The previous protocol
# (2026-10-15) compared the one-feature counterfactual drops of a label-trained
# gradient-boosted classifier against the HeuristicBankScorer's zero-reference
# attribution -- a different function, a different reference point, different units.
# Its measured failure (Pearson r = -0.054, RAE = 1.425 at the graded seed; the
# audit note in spec/18 section 3a) was a protocol finding, not synthesizer quality,
# and this block pins the matched replacement.
#
# Object under explanation: the HeuristicBankScorer approval probability
# (prism_generator/causal_scm.py), restricted to the eleven explained columns of
# `explained_feature_contract`. Every field the columns do not name (channel, MCC,
# hour of day, the card's 30-day mean ticket, credit limit, unmapped authentication
# flags) is held at the graded record's own context, exactly as the engine's scorer
# reads it (`HeuristicBankScorer.probability_on_columns`). The graded population is
# the fraud records of the test window that carry the pipeline's causal payload.
pillar_4_attribution_protocol:
  background_rows: 100          # B: rows drawn without replacement from the first 70% (train window)
  background_rng: "np.random.default_rng(run_seed)"
  coalition_value: "v(S) = mean over the B background rows of f(record with the S columns at the record's own values and the remaining columns at the background row's values)"
  ground_truth: "exact interventional Shapley by subset enumeration over all 2^11 coalitions; per-record efficiency identity sum(phi*) == v(full) - v(empty) asserted to 1e-6. Weights |S|!(n-|S|-1)!/n! (Roth 1988)."
  explainer: "shap.KernelExplainer(f, background) at the explained point, l1_reg=0.0 (no fractional-l1 sparsification: the row grades the estimator, not a sparse surrogate)"
  explainer_nsamples: 256       # Q: coalition budget handed to KernelSHAP (measured mean RAE at the graded seed: Q=128 0.066, Q=256 0.038, Q=512 0.022)
  explainer_l1_reg: 0.0
  explainer_rng: "numpy global RNG seeded from (run_seed, record ordinal), global state saved and restored around each record (shap 0.52 samples coalitions from the global stream)"
  normalization: "both attribution vectors L1-normalized by the sum of absolute values; rank metrics on |phi|, Pearson on signed values (GroundTruthXAIEvaluator conventions)"
  measured_at_seed_42_protocol_fast: {mean_kendall_tau: 0.9055, mean_spearman_rho: 0.9632, mean_pearson_r: 0.9991, mean_precision_at_3: 1.0, mean_relative_attribution_error: 0.0384, mean_causal_faithfulness: 0.899}
