  - id: "slice-25-fix-time-span-normalisation-and-unsound-test-invariants"
    title: "Make --days Mean What It Says, and Replace Test Invariants That Were Already False"
    status: "verified"
    target_spec_files:
      - "prism_generator/engine.py"
      - "prism_generator/benchmark_reporter.py"
      - "tests/test_time_span_pacing.py"
      - "tests/test_synthesizer/test_intervention_ground_truth.py"
      - "publish/README.md"
    acceptance_criteria:
      - time_span_days_controls_the_realised_span: true
      - the_inter_arrival_gate_measures_shape_not_the_span_error: true
      - no_test_assertion_is_weakened_to_make_a_change_pass: true
      - every_replacement_invariant_is_validated_on_the_baseline_too: true
      - canonical_data_sample_csv_is_preserved_per_gitignore: true
      - the_dataset_card_no_longer_says_the_cause_is_unknown: true
    verdict: >-
      verified: D1 fixed -- _get_card_hawkes_params divided each persona's volume by a hard-coded
      55.0 (US) / 0.684 (IN) that equalled ONE persona's volume rather than the population mean,
      so scales averaged 1.1793 and every paced batch ran ~18% hot. Replaced by
      _persona_volume_scale_mean(), a cached card-weighted region-aware measurement. The
      published shape (cards=1000, n=100000, days=30) moved from 46.91 d (+56.4%) to 29.80 d
      (-0.7%); the benchmark path (80 cards, 2000 rows, 12 d, 5% fraud) lands at 12.50 d (+4.1%).
      A feedback controller that also steered the span was built, measured and REVERTED: it
      overshot wherever card freezes depleted the pool (100000 rows at 2% fraud, 44.8 d became
      48.5 d) because frozen cards emit nothing that any rate correction can reach. D2 fixed --
      the inter-arrival W1 gate built its reference renewal process from the REQUESTED span, so
      it measured the D1 rate error as arrival-shape error and inflated W1 by 0.03-0.09 on all
      five pinned seeds; it now uses the realised span. D9 -- test_zero_synthetic_ip_distance_leak
      asserted a minimum fraud ip_distance of 1.5 km and that 0.5 km captured zero frauds; BOTH
      were already failing on the untouched baseline 6938da3 over seeds 1-40 (4/40 and 1/40).
      spec/07 section 12 makes the legitimate geolocation error lognormal and so unbounded below
      (measured legit minima 0.600 / 0.850 / 0.990 km) and section 17 routes victim-device
      attacks through that same distribution, so enforcing a 1.5 km fraud floor would have
      MANUFACTURED the leak -- a rule reading "below 1.5 km means legitimate" would have become
      perfect. Replaced with three distributional invariants validated on 40/40 seeds with the
      fix and 20/20 on the baseline, so they encode a generator property rather than a code
      state. D4 was flagged as 12 MB of dead data and is CLEARED: .gitignore line 61 records
      "preserve canonical data/sample_*.csv", so the samples were restored rather than
      overridden. D5 -- ten dead one-off deliverable generators (~5,600 lines) removed;
      inspect_generated_data.py kept as the inspector for those canonical samples. D10-D14
      audited and verified: D10 continuous reference control passes, D11 single-owner event scheduling
      restores ISO 51 rate, D12 Indian income grounded in PLFS 2025, D13 multi-currency attack parity,
      and D14 expired holds release propagation to double-entry ledger. Suite 344/344 green.

