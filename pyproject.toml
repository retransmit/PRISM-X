[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-fraud"
version = "0.1.0"
description = "Explainable real-time credit card fraud detection"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # joblib 1.5.3 assigns to ndarray.shape while unpickling, which numpy 2.5
    # deprecated. Third-party internals, not actionable here, ~1200 per run.
    # Drop this line once joblib ships a fix.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
